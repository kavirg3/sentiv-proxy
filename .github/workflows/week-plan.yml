# Sunday week plan — 18:00 SAST (16:00 UTC) every Sunday. Hub v309.
# Plans the appointment setter's coming week by area day (Hub: Plan calls → Area days) via
# the Supabase function `lead-feed`, then sends the owner one notification with the week.
# No secret: each call proves itself with a GitHub-signed OIDC token (id-token: write).
# Spend switch: repo variable LEAD_FEED_LIVE, same as the daily feed. Anything but "true" = dry run.
# The owner turns it off in the Hub (Area days → "Plan next week every Sunday").
# Run it by hand: GitHub → Actions → "Sunday week plan" → Run workflow.
name: Sunday week plan
on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan on paper only, save nothing"
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Plan the setter's week
        env:
          LEAD_FEED_LIVE: ${{ vars.LEAD_FEED_LIVE }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: node week-plan.js
